main: net.hypixel.Hypixel
name: Hypixel
version: 1.0
author: xeqvi
commands:
  spawn:
    description: Teleport to a random lobby.

  lobby:
    description: Connect to a random lobby.

  stuck:
    description: Teleport to the current world's spawn.

  setspawn:
    description: Sets the server spawn to your current location.
    usage: /setspawn
    permission: hypixel.setspawn
    permission-message: You do not have permission to use this command.
